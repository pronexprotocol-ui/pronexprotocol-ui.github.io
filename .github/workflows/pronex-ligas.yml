# Pronex_Study · ligas: fecha a semana (subidas, descidas e prémios) e faz os grupos.
# Corre todos os dias às 00:07 UTC (meia-noite em Lisboa no inverno, 01:07 no verão).
name: Pronex_Study · ligas
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pronex-ligas
  cancel-in-progress: false
jobs:
  ligas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .github/pronex
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/pronex
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --silent
      - run: node ligas.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
