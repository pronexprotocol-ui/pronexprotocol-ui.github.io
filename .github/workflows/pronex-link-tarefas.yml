# Pronex_Link · tarefas diárias: limpeza do que já não faz falta guardar e números da comunidade (link_stats/geral).
# O registo mostra só contagens (o repositório é público).
name: Pronex_Link · tarefas diárias
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pronex-link-tarefas
  cancel-in-progress: false
jobs:
  tarefas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/pronex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/pronex
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --silent
      - run: node link-limpeza.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
