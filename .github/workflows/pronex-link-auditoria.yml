# Pronex_Link · auditoria da base de dados (só lê; só corre quando alguém a manda correr).
# Mostra números e códigos de problema, nunca nomes nem textos (o repositório é público).
name: Pronex_Link · auditoria
on:
  # todas as segundas de manhã; se houver dados incoerentes a tarefa falha e o GitHub avisa por email
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/pronex
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/pronex
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --silent
      - run: node link-auditoria.mjs --estrito
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
