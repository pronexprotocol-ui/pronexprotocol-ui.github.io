# Pronex_Study · limpeza diária: tira da base de dados o que a app já não deve guardar. Não escreve dados de alunos nos registos.
name: Pronex_Study · limpeza
on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pronex-limpeza
  cancel-in-progress: false
jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/pronex
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/pronex
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --silent
      - run: node limpeza.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
