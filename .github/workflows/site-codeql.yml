# Site PRONEX · análise de segurança do código (ponto 13 das melhorias).
# O CodeQL do GitHub lê o JavaScript do site à procura de falhas conhecidas (por exemplo,
# texto de fora a entrar no HTML sem ser escapado). Os avisos aparecem em Security > Code scanning.
name: Site PRONEX · CodeQL
on:
  push:
    branches: [main]
    paths: ['fonte/**/*.js']
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config: |
            paths:
              - fonte
      - uses: github/codeql-action/analyze@v3
