# Pronex_Study · publica no Firebase as regras do Firestore do repositório (só corre quando alguém a manda correr).
# Antes de correr: a tarefa «Pronex_Study · testes» tem de ter passado no ramo principal.
name: Pronex_Study · publicar regras
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pronex-publicar-regras
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .github/pronex
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/pronex
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --silent
      - run: node publicar-regras.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
