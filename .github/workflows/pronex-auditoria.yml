# Pronex_Study · auditoria da base de dados: só lê e mostra contagens e anomalias (nunca nomes, emails nem textos).
# Corre às segundas de manhã e quando se carrega em «Run workflow». Fica vermelho se alguma coisa precisar de atenção.
name: Pronex_Study · auditoria da base de dados
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'
permissions:
  contents: read
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/pronex
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/pronex
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --silent
      - run: node auditoria-bd.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
