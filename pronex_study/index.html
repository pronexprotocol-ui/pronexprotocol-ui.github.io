<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pronex_Study</title>
<meta name="description" content="Pronex_Study: estuda ao nível do teu objetivo. Exercícios, fórmulas, calculadora e progresso.">
<meta name="theme-color" content="#090C18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pronex_Study">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fontes/bricolage-latin-800.woff2) format("woff2");font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(fontes/bricolage-latin-ext-800.woff2) format("woff2");font-weight:800;font-style:normal;font-display:swap;unicode-range:U+0100-02AF,U+1E00-1EFF,U+20A0-20C0,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Bricolage Grotesque";src:url(fontes/bricolage-latin-700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Exo 2";src:url(fontes/exo-2-latin.woff2) format("woff2");font-weight:500 800;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url(fontes/inter-latin.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fontes/jetbrains-mono-latin.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
</style>
<script src="config.js"></script>
</head>
<body>
<style>
/* Pronex_Study — app escura com a identidade PRONEX (azul-noite, gradiente ciano→azul→roxo, Exo 2 + Inter).
   Layout: barra lateral no PC, barra de separadores em baixo no telemóvel; o exercício é um ecrã focado e as ferramentas abrem ao lado (PC) ou numa folha que empurra o conteúdo (telemóvel). */
:root{
  --bg:#0A0F2B; --bg2:#0E1438; --surface:#10173d; --surface2:#141B47; --raise:#1a2257;
  --ink:#FFFFFF; --muted:#B1B6C3; --dim:#8A90A3; --line:rgba(177,182,195,.14); --line2:rgba(177,182,195,.28);
  --cyan:#00E5FF; --royal:#1E3AFF; --purple:#7B2CFF; --purple-t:#CC5CFF; --ok:#2EE6A6; --bad:#FF5C7A; --warn:#FEBC2E;
  --ok-soft:rgba(46,230,166,.12); --bad-soft:rgba(255,92,122,.12); --warn-soft:rgba(254,188,46,.10); --cyan-soft:rgba(0,229,255,.08); --cyan-line:rgba(0,229,255,.35); --purple-soft:rgba(123,44,255,.16);
  --grad:linear-gradient(135deg,#1E3AFF 0%,#7B2CFF 100%); --grad-line:linear-gradient(90deg,#00E5FF,#1E3AFF 45%,#7B2CFF); --grad-text:linear-gradient(100deg,#00E5FF 0%,#6E8BFF 45%,#7B2CFF 100%);
  --c1:#00E5FF; --c1b:rgba(0,229,255,.12); --c2:#2EE6A6; --c2b:rgba(46,230,166,.12); --c3:#FEBC2E; --c3b:rgba(254,188,46,.12); --c4:#CC5CFF; --c4b:rgba(123,44,255,.2);
  --f-display:"Exo 2","Segoe UI",system-ui,sans-serif; --f-body:"Inter","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",Consolas,monospace;
  --r:14px; --r-lg:20px; --side:248px; --sheet:44vh;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60rem 30rem at 85% -10%,rgba(123,44,255,.16),transparent 60%),radial-gradient(50rem 30rem at -10% 10%,rgba(30,58,255,.14),transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance;line-height:1.15}
p{margin:0}
.gt{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.mono{font-family:var(--f-mono)}
.eyebrow{font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--cyan)}

/* estrutura */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:28px}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-block:22px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(0,229,255,.35))}
.brand b{font:800 1.15rem var(--f-display);letter-spacing:.02em}
.brand b span{color:var(--cyan)}
.snav{display:flex;flex-direction:column;gap:4px}
.snav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);padding:11px 14px;border-radius:12px;font-weight:600;cursor:pointer;text-align:left}
.snav button:hover{background:var(--surface);color:var(--ink)}
.snav button[aria-current="page"]{background:var(--surface2);color:var(--ink);box-shadow:inset 3px 0 0 var(--cyan)}
.snav svg,.tabbar svg{width:20px;height:20px;flex:none}
.sidecard{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.main{min-width:0;padding-block:22px}
.topbar{display:none}
.tabbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .side{display:none}
  .main{padding-top:0}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,15,43,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    align-items:center;justify-content:space-between;padding-block:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .topbar .brand img{width:32px;height:32px}
  .tabbar{display:flex;position:fixed;inset:auto 0 0 0;z-index:40;background:rgba(14,20,56,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--dim);padding:5px 10px;border-radius:10px;cursor:pointer;min-width:62px}
  .tabbar button[aria-current="page"]{color:var(--cyan)}
  body.playing .tabbar{display:none}
}
.chipstat{display:inline-flex;align-items:center;gap:6px;font:700 .82rem var(--f-mono);padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.chipstat svg{width:15px;height:15px}
.flame{color:var(--warn)} .bolt{color:var(--cyan)}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface2);border-radius:12px;padding:10px 18px;font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--cyan-line)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px rgba(30,58,255,.35)}
.btn.pri:hover:not(:disabled){filter:brightness(1.1)}
.btn.cy{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.sect{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.sect-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sect-h h2{font-size:1.25rem}
.pagehead{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.pagehead h1{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:800}
.back{border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;padding:0;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.back:hover{color:var(--cyan)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad-line);border-radius:99px}
.bar i.ok{background:var(--ok)} .bar i.bad{background:var(--bad)} .bar i.mid{background:var(--warn)}
.pill{font:700 .64rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.pri{background:var(--bad-soft);color:var(--bad)} .pill.dom{background:var(--ok-soft);color:var(--ok)} .pill.new{background:var(--cyan-soft);color:var(--cyan)} .pill.soon{background:rgba(255,255,255,.06);color:var(--dim)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:20px;color:var(--muted);text-align:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:9px;font-weight:600;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--cyan)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:5px 13px;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--cyan-soft);border-color:var(--cyan-line);color:var(--cyan)}
input[type=text],textarea,select{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;color:var(--ink);padding:10px 12px;font:inherit}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--cyan-line);outline:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);font-weight:600}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:800 1rem var(--f-display);color:#fff;flex:none}
.avatar.sm{width:34px;height:34px;border-radius:11px;font-size:.82rem}
.avatar.lg{width:76px;height:76px;border-radius:22px;font-size:1.7rem}
.g0{background:linear-gradient(135deg,#1E3AFF,#7B2CFF)} .g1{background:linear-gradient(135deg,#00B8D4,#1E3AFF)} .g2{background:linear-gradient(135deg,#7B2CFF,#FF5C7A)}
.g3{background:linear-gradient(135deg,#0E9F7E,#00B8D4)} .g4{background:linear-gradient(135deg,#C2410C,#FEBC2E)} .g5{background:linear-gradient(135deg,#334155,#64748B)}

/* início */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px;background:linear-gradient(160deg,rgba(30,58,255,.28),rgba(123,44,255,.18) 55%,rgba(14,20,56,.6));border:1px solid var(--line2);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--grad-line)}
.hero h1{font-size:clamp(1.6rem,3.8vw,2.4rem);font-weight:800}
.hero .sub{color:var(--muted);margin-top:6px;max-width:52ch}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .in b{font:800 1.7rem var(--f-display);display:block;line-height:1}
.ring .in span{font-size:.72rem;color:var(--muted)}
@media (max-width:560px){.hero{grid-template-columns:minmax(0,1fr);padding:20px}.ring{width:110px;height:110px;justify-self:start}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font:800 1.6rem var(--f-display);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.kpi .v svg{width:20px;height:20px}
.kpi .s{font-size:.78rem;color:var(--dim)}
.lvl{display:flex;flex-direction:column;gap:8px}
.lvl .row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.subj{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px;cursor:pointer;min-height:150px;overflow:hidden}
.subj:hover{border-color:var(--cyan-line)}
.subj.off{cursor:default;opacity:.78}
.subj.off:hover{border-color:var(--line)}
.subj .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.subj .ic svg{width:22px;height:22px;color:#fff}
.subj b{font:700 1.05rem var(--f-display)}
.subj .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--dim)}
.list{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.lrow .n{font-weight:600} .lrow .t{font-size:.78rem;color:var(--dim)}
@media (max-width:520px){.lrow{grid-template-columns:minmax(0,1fr) auto}.lrow .bar{display:none}}
.tip{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--cyan-line);background:var(--cyan-soft);border-radius:var(--r);padding:14px 16px}
.tip svg{width:20px;height:20px;color:var(--cyan);flex:none;margin-top:2px}

/* módulo */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px;cursor:pointer}
.mode:hover{border-color:var(--cyan-line)}
.mode.main{background:var(--grad);border-color:transparent}
.mode b{font:700 1rem var(--f-display)} .mode span{font-size:.8rem;color:var(--muted)} .mode.main span{color:rgba(255,255,255,.85)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:9px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;min-height:108px}
.tcard:hover{border-color:var(--cyan-line)}
.tcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tcard .nm{font-weight:600;line-height:1.3}
.tcard .meta{display:flex;justify-content:space-between;font:.76rem var(--f-mono);color:var(--dim);margin-top:auto}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}

/* exercício */
.playtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.playtop .ttl{flex:1;min-width:0}
.playtop .ttl b{display:block;font:700 1.05rem var(--f-display)}
.playtop .ttl span{font:.78rem var(--f-mono);color:var(--dim)}
.segs{display:flex;gap:3px;margin-bottom:14px}
.segs i{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);cursor:pointer}
.segs i.ok{background:var(--ok)} .segs i.bad{background:var(--bad)} .segs i.cur{box-shadow:0 0 0 2px var(--cyan)}
.toolrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tool{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);border-radius:11px;padding:7px 13px;font-weight:600;font-size:.84rem;cursor:pointer;color:var(--muted)}
.tool svg{width:17px;height:17px}
.tool[aria-pressed="true"]{background:var(--cyan-soft);border-color:var(--cyan-line);color:var(--cyan)}
.playgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.playgrid.open{grid-template-columns:minmax(0,1fr) minmax(320px,380px)}
.qcard{padding:24px}
.qtag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tag{font:700 .66rem var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--cyan);background:var(--cyan-soft);border:1px solid var(--cyan-line);padding:3px 9px;border-radius:7px}
.qname{font-weight:600;color:var(--muted);font-size:.88rem}
.ctx p{margin:0 0 8px;color:var(--muted)} .ctx b{color:var(--ink)}
.tbl{overflow-x:auto;margin:6px 0 12px}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem;min-width:max-content}
th,td{border:1px solid var(--line2);padding:6px 12px;text-align:center}
th{background:var(--surface2);font-weight:700;color:var(--ink)}
td.l{text-align:left}
.q{font:700 1.25rem/1.35 var(--f-display);margin:12px 0 16px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--bg2);border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:1rem;cursor:pointer;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--cyan-line);background:var(--surface2)}
.opt .let{font:700 .82rem var(--f-mono);width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--surface2);flex:none;color:var(--cyan)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .let{background:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .let{background:var(--bad);color:var(--bg)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;border:1px solid var(--line2);background:var(--bg2)}
.fb h3{font-size:1rem;margin-bottom:6px}
.fb.ok{border-color:var(--success-line,rgba(46,230,166,.5))} .fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb ol{margin:6px 0 0;padding-left:22px;font-family:var(--f-mono);font-size:.84rem;line-height:1.8;color:var(--muted)}
.fb .trap{margin-top:8px;font-size:.88rem;color:var(--warn)}
.xpgain{display:inline-flex;align-items:center;gap:4px;font:700 .8rem var(--f-mono);color:var(--cyan);margin-left:8px}
.ai{margin-top:12px;border:1px solid rgba(123,44,255,.45);border-radius:14px;padding:14px 16px;background:var(--purple-soft)}
.ai .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.88rem;margin-bottom:6px;color:var(--purple-t)}
.ai .h svg{width:16px;height:16px}
.ai .body{white-space:pre-wrap;font-size:.94rem;line-height:1.6}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto}
.panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.panel .ph h3{font-size:1rem}
.xbtn{border:1px solid var(--line2);background:var(--surface2);border-radius:9px;width:30px;height:30px;cursor:pointer;font-weight:700}
@media (max-width:1060px){
  .playgrid.open{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;inset:auto 0 0 0;top:auto;z-index:50;height:var(--sheet);max-height:none;border-radius:20px 20px 0 0;border-bottom:0;

/* ===== v2: movimento, efeitos e ecrãs de app ===== */

[data-view]:not([hidden]){animation:viewIn .38s var(--ease)}

  --grad:linear-gradient(0deg,#9178E6,#9178E6); --grad-line:linear-gradient(90deg,#9178E6,#9178E6); --grad-text:linear-gradient(90deg,#B9A6FF,#B9A6FF);
  --k-blue:#5FA0FC; --k-blue-d:#4A84D6; --k-coral:#FB7E5B; --k-coral-d:#D56B4D; --k-pink:#E879C0; --k-pink-d:#C567A3;
  --k-green:#00C386; --k-green-d:#00A672; --k-lilac:#9178E6; --k-lilac-d:#7560C4; --k-yellow:#FFC93C; --k-yellow-d:#D9A72A; --k-dark:#090C18; --k-navy:#06173B;
  --f-display:"Bricolage Grotesque","Exo 2","Segoe UI",system-ui,sans-serif;
  --r:20px; --r-lg:28px;
}
html,body{background:var(--bg)}
body::after{display:none}
h1,h2,h3,.pagehead h1,.hero h1{font-family:var(--f-display);font-weight:800;letter-spacing:-.015em}
h1{line-height:1.05}
.gt{background:none;color:var(--k-lilac);-webkit-text-fill-color:currentColor}
.eyebrow{font:700 .74rem var(--f-body);letter-spacing:.02em;text-transform:none;color:var(--purple-t)}
.muted{color:var(--muted)} .dim{color:var(--dim)}

/* Botões em pílula com sombra de autocolante */
.btn{border:0;border-radius:999px;background:var(--surface2);color:var(--ink);font:800 .95rem var(--f-display);padding:12px 22px;box-shadow:0 4px 0 #0E1019;transition:transform .12s,box-shadow .12s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #0E1019}
.btn.sm{padding:8px 16px;font-size:.85rem;border-radius:999px}
.btn.pri{background:#F4F2FF;color:var(--k-dark);box-shadow:0 4px 0 #B7B0D8}
.btn.pri:active:not(:disabled){box-shadow:0 1px 0 #B7B0D8}
.btn.cy{background:var(--k-lilac);color:var(--k-dark);box-shadow:0 4px 0 var(--k-lilac-d)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.6px var(--line2)}
.btn.ghost:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 0 0 1.6px var(--line2)}
.btn.bad{background:var(--k-coral);color:var(--k-dark);box-shadow:0 4px 0 var(--k-coral-d);border:0}
.xbtn{border-radius:999px}

/* Cartões planos, sem contorno */
.card{background:var(--surface);border:0;border-radius:var(--r-lg)}
.empty,.estate{border:0;background:var(--surface);border-radius:var(--r-lg)}
.estate .ei{background:var(--cyan-soft);color:var(--purple-t);border-radius:16px}
.estate b{font-family:var(--f-display);font-weight:800}

/* Chips e separadores */
.chip{border:1.6px solid transparent;background:var(--surface2);color:var(--ink);border-radius:999px;padding:7px 15px;font-weight:600}
.chip[aria-pressed="true"]{background:#F4F2FF;color:var(--k-dark);border-color:#F4F2FF}
.seg{background:var(--surface);border:0;border-radius:999px;padding:5px;gap:4px}
.seg button{border-radius:999px;font:800 .9rem var(--f-display);color:var(--muted);padding:9px 16px}
.seg button[aria-pressed="true"]{background:#F4F2FF;color:var(--k-dark);box-shadow:none}
.tag{border-radius:999px}

/* Estatísticas do topo: número grosso e ícone colorido */
.chipstat{background:transparent;border:0;font:800 1rem var(--f-display);padding:4px 6px;gap:4px}
.chipstat svg{width:18px;height:18px}
.flame{color:#FF7A3D} .bolt{color:var(--k-blue)}
.chipstat.frz{color:#9BD3FF}
.hchips .chipstat{background:rgba(6,23,59,.12);color:var(--k-navy);padding:6px 12px;border-radius:999px;font-size:.92rem}
.hchips .chipstat .flame,.hchips .chipstat .bolt{color:var(--k-navy)}

/* Navegação */
.snav button{border-radius:999px;font:700 .95rem var(--f-display)}
.snav button[aria-current="page"]{background:var(--surface2);box-shadow:none;color:var(--ink)}
.snav button[aria-current="page"] svg{color:var(--k-lilac)}
@media (max-width:900px){
  .topbar{background:rgba(9,12,24,.92);border-bottom:0}
  .tabbar{background:rgba(9,12,24,.96);border-top:1px solid var(--line)}
  .tabbar button{font:700 .7rem var(--f-display);border-radius:16px}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button[aria-current="page"] svg{color:var(--k-lilac)}
}

/* Início: cartão principal azul com texto escuro */
.hero{background:var(--k-blue);border:0;border-radius:32px;box-shadow:0 6px 0 var(--k-blue-d);color:var(--k-navy)}
.hero::before,.hero::after{display:none}
.hero h1,.hero .eyebrow{color:var(--k-navy)}
.hero .gt{color:#fff}
.hero .sub{color:rgba(6,23,59,.78)}
.hero .ring stop{stop-color:var(--k-navy)}
.hero .ring circle:first-of-type{stroke:rgba(6,23,59,.16)}
.hero .ring .in b{color:var(--k-navy)} .hero .ring .in span{color:rgba(6,23,59,.7)}
.contcard{border-radius:var(--r-lg)}
.tcard{background:var(--k-yellow);color:var(--k-dark);box-shadow:0 4px 0 var(--k-yellow-d);border:0}
.tcard .ti{background:rgba(9,12,24,.12);color:var(--k-dark)}
.tcard span:not(.ti){color:rgba(9,12,24,.72)}
button.tcard.empty{background:var(--surface);color:var(--ink);box-shadow:none;border:0}
button.tcard.empty .ti{background:rgba(255,201,60,.14);color:var(--k-yellow)}
button.tcard.empty span:not(.ti){color:var(--muted)}
.tcard .btn.pri{background:var(--k-dark);color:#F4F2FF;box-shadow:0 4px 0 #000}

/* Disciplinas e modos: cartões coloridos */
.subj{border:0;border-radius:var(--r-lg);background:var(--surface)}
.subjects.big .subj.on1{background:var(--k-lilac);color:var(--k-dark);box-shadow:0 5px 0 var(--k-lilac-d)}
.subjects.big .subj.on1 b{color:var(--k-dark);font-family:var(--f-display);font-weight:800}
.subjects.big .subj.on1 .dim,.subjects.big .subj.on1 .meta{color:rgba(9,12,24,.72)}
.subjects.big .subj.on1 .ic{background:var(--k-dark)!important}
.subj b{font-family:var(--f-display);font-weight:800}
.mode{border:0;border-radius:var(--r-lg);color:var(--k-dark);box-shadow:0 5px 0 var(--d)}
.mode b{font:800 1.08rem var(--f-display);color:var(--k-dark)}
.mode span,.mode.main span{color:rgba(9,12,24,.72)}
.modes .mode:nth-child(4n+1){background:var(--k-blue);--d:var(--k-blue-d)}
.modes .mode:nth-child(4n+2){background:var(--k-coral);--d:var(--k-coral-d)}
.modes .mode:nth-child(4n+3){background:var(--k-pink);--d:var(--k-pink-d)}
.modes .mode:nth-child(4n+4){background:var(--k-green);--d:var(--k-green-d)}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--d)}

/* Exercícios */
.opt{background:var(--surface2);border:2px solid transparent;border-radius:20px;padding:14px 16px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--k-lilac);background:var(--surface2)}
.opt .let{border-radius:999px;background:var(--k-dark);color:var(--purple-t);font-family:var(--f-display);font-weight:800}
.opt.ok{border-color:var(--k-green);background:rgba(0,195,134,.16)} .opt.ok .let{background:var(--k-green);color:var(--k-dark)}
.opt.bad{border-color:var(--k-coral);background:rgba(251,126,91,.16)} .opt.bad .let{background:var(--k-coral);color:var(--k-dark)}
.opt.ok.just{box-shadow:0 0 0 4px rgba(0,195,134,.18)}
.fb{border:0;border-radius:24px;background:var(--surface)}
.fb h3{font-family:var(--f-display);font-weight:800}
.fb.ok h3{color:var(--k-green)} .fb.bad h3{color:var(--k-coral)}
.segs i{border-radius:999px}
.segs i.ok{background:var(--k-green)} .segs i.bad{background:var(--k-coral)} .segs i.cur{box-shadow:0 0 0 2px #F4F2FF}

/* Avatares nas cores do tema */
.g0{background:var(--k-lilac)} .g1{background:var(--k-blue)} .g2{background:var(--k-coral)} .g3{background:var(--k-green)} .g4{background:var(--k-pink)} .g5{background:var(--k-yellow)}
.avatar{color:var(--k-dark);font-family:var(--f-display);font-weight:800;border-radius:999px}
.avatar.sm{border-radius:999px} .avatar.lg{border-radius:28px}
.colors button{border-radius:999px}

/* Conversa e tutor: balões */
.msg .txt{display:inline-block;max-width:100%;background:var(--surface2);color:var(--ink);padding:10px 14px;border-radius:6px 20px 20px 20px;font-size:.95rem}
.msg.me .txt{background:var(--k-lilac);color:var(--k-dark)}
.msg .who b{font-family:var(--f-display);font-weight:800}
.msg.me .who b{color:var(--purple-t)}
.chat{border-radius:var(--r-lg)}
.composer{background:transparent;border-top:1px solid var(--line);padding:12px}
.composer input,.composer textarea{border-radius:999px;background:var(--surface2);border:0;padding:12px 18px}
.chans button{border-radius:999px}
.post{border-radius:var(--r-lg)}
.pact.on{color:var(--k-pink)} .pact.on svg{fill:var(--k-pink)}
.pcomp textarea{border-radius:20px;background:var(--surface2);border:0}
.kgreet{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin:auto 0 8px}
.kgreet img{width:64px;height:64px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.kbub{background:var(--surface2);border-radius:28px;padding:16px 20px;font:800 clamp(1.3rem,3.6vw,1.75rem)/1.15 var(--f-display);color:var(--ink);max-width:22ch}
.sugg{gap:10px}
.sugg .chip{background:#F4F2FF;color:var(--k-dark);font:800 .9rem var(--f-display);padding:10px 16px;box-shadow:0 4px 0 #B7B0D8;border:0}
.sugg .chip:active{transform:translateY(3px);box-shadow:0 1px 0 #B7B0D8}
.typing i{background:var(--purple-t)}

/* Ranking e ligas */
.rrow{border:0;border-radius:24px;background:var(--surface)}
.rrow.me{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--k-lilac)}
.rrow .pos{font-family:var(--f-display);font-weight:800}
.rrow .pos.top{color:var(--k-yellow)}
.league .lname{font-family:var(--f-display)}

/* Perfil, conquistas, KPIs */
.kpi{border:0;border-radius:24px;background:var(--surface)}
.kpi .v{font-family:var(--f-display);font-weight:800}
.badge{border:0;border-radius:24px;background:var(--surface)}
.badge .bi{border-radius:999px}
.phead{border-radius:32px}
input,select,textarea{border-radius:16px}
.f input,.f select,.f textarea{background:var(--surface2);border:1.6px solid transparent}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--k-lilac);outline:none}

/* Arranque e boas-vindas */
.splash img{filter:drop-shadow(0 8px 0 rgba(0,0,0,.4))}
.splash b span,.splash code{color:var(--k-lilac)}
.onb{background:var(--bg)}
.term{display:none}
.goalopt{border:0;border-radius:24px;background:var(--surface)}
.goalopt[aria-pressed="true"]{background:var(--k-lilac);color:var(--k-dark);box-shadow:0 5px 0 var(--k-lilac-d)}
.goalopt[aria-pressed="true"] span,.goalopt[aria-pressed="true"] em{color:rgba(9,12,24,.75)}
.goalopt b{font-family:var(--f-display);font-weight:800}

/* Celebração */
.celeb{background:radial-gradient(circle at 50% 30%,rgba(145,120,230,.32),transparent 60%),#090C18}
.cflame{background:#FF7A3D;box-shadow:0 8px 0 #C95A26}
.cweek .on i{background:#FF7A3D}

/* Folhas e lições */
.nsheet{background:var(--bg2);border-radius:32px 32px 0 0;border:0}
.instcard{border:0;background:var(--k-lilac);color:var(--k-dark);box-shadow:0 5px 0 var(--k-lilac-d);border-radius:var(--r-lg)}
.instcard span{color:rgba(9,12,24,.75)}
.instcard .btn.pri{background:var(--k-dark);color:#F4F2FF;box-shadow:0 4px 0 #000}
.tip{border-radius:var(--r-lg);border:0;background:var(--surface)}
.toast{border-radius:999px;background:#F4F2FF;color:var(--k-dark);border:0;font-weight:700;box-shadow:0 6px 0 #B7B0D8}

/* ===== v1.8: entrada, consentimento, notificações, definições, painel com PIN, Nex ===== */
:root{--x8-bg:#090C18;--x8-s1:#1A1C28;--x8-s2:#22242F;--x8-line:#2B2E3B;--x8-ink:#F4F2FF;--x8-ink2:#A8A6B8;--x8-ink3:#6E6C80;--x8-lil:#9178E6;--x8-lil-d:#7560C4;--x8-lil2:#B3A2FF;--x8-blue:#5FA0FC;--x8-blue-d:#4A84D6;--x8-coral:#FB7E5B;--x8-pink:#E879C0;--x8-green:#00C386;--x8-green-d:#00A672;--x8-yel:#FFC93C;--x8-navy:#06173B;--x8-spring:cubic-bezier(.34,1.56,.64,1);--x8-std:cubic-bezier(.2,0,0,1);--x8-head:"Bricolage Grotesque","Exo 2","Arial Black",system-ui,sans-serif}
.x8g{position:fixed;inset:0;z-index:130;background:var(--x8-bg);color:var(--x8-ink);overflow-y:auto;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.x8g.blue{background:var(--x8-blue);color:var(--x8-navy)}
.x8g::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background:radial-gradient(28rem 22rem at 10% -5%,rgba(145,120,230,.32),transparent 65%),radial-gradient(26rem 20rem at 100% 100%,rgba(95,160,252,.2),transparent 65%)}
.x8g.blue::before{background:radial-gradient(30rem 26rem at 50% 30%,rgba(255,255,255,.22),transparent 65%);opacity:1}
.x8box{position:relative;width:100%;max-width:440px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:16px;animation:x8in .32s var(--x8-std) both}
@keyframes x8in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.x8box.back{animation-name:x8back}@keyframes x8back{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.x8top{display:flex;align-items:center;gap:12px;min-height:44px}
.x8ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--x8-s2);color:var(--x8-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.x8ib svg{width:22px;height:22px}
.x8prog{flex:1;display:flex;gap:6px;max-width:180px;margin:0 auto}
.x8prog i{flex:1;height:6px;border-radius:9px;background:var(--x8-s2);transition:background .3s}
.x8prog i.on{background:var(--x8-lil)}
.x8mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.x8c{text-align:center;align-items:center}
.x8g h1{font:800 clamp(30px,8vw,38px)/1.04 var(--x8-head);letter-spacing:-.02em;margin:0;text-wrap:balance}
.x8g p{margin:0}
.x8sub{color:var(--x8-ink2);font-size:16px;line-height:1.5}
.x8g.blue .x8sub{color:rgba(6,23,59,.78)}
.x8fine{font-size:13px;color:var(--x8-ink2);text-align:center;line-height:1.45}
.x8g.blue .x8fine{color:rgba(6,23,59,.65);font-weight:600}
.x8fine a{color:var(--x8-lil2)}
.x8dock{display:flex;flex-direction:column;gap:12px;align-items:stretch;padding-top:8px}
.x8p{font:800 18px var(--x8-head);border:0;border-radius:999px;padding:16px 24px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s var(--x8-std),box-shadow .12s var(--x8-std),opacity .2s;text-decoration:none}
.x8p.w{background:#fff;color:var(--x8-navy);box-shadow:0 5px 0 #B7B0D8}
.x8p.l{background:var(--x8-lil);color:#fff;box-shadow:0 5px 0 var(--x8-lil-d)}
.x8p.g{background:var(--x8-green);color:#fff;box-shadow:0 5px 0 var(--x8-green-d)}
.x8p.c{background:var(--x8-coral);color:var(--x8-navy);box-shadow:0 5px 0 #D56B4D}
.x8p.gh{background:transparent;color:var(--x8-ink);border:2px solid #3A3D4D;box-shadow:none}
.x8p.sm{font-size:15px;padding:10px 16px}
.x8p:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 transparent}
.x8p:disabled{opacity:.42;cursor:not-allowed}
.x8p:focus-visible,.x8ib:focus-visible,.x8lk:focus-visible{outline:3px solid #7FE7FF;outline-offset:3px}
.x8p svg{width:20px;height:20px;flex:none}
.x8lk{background:none;border:0;font:800 16px var(--x8-head);color:var(--x8-lil2);cursor:pointer;padding:6px;align-self:center}
.x8g.blue .x8lk{color:var(--x8-navy)}
.x8nex{display:block;margin:0 auto}
.x8nex svg{display:block;width:100%;height:auto;overflow:visible}
.x8idle{animation:x8float 3.2s var(--x8-std) infinite}
.x8idle ellipse[ry="12"],.x8idle circle[r="3"]{animation:x8blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes x8float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes x8blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.x8jump{animation:x8jump .9s var(--x8-spring)}
@keyframes x8jump{0%{transform:none}15%{transform:translateY(6px) scale(1.12,.86)}45%{transform:translateY(-40px) scale(.94,1.08) rotate(-4deg)}70%{transform:scale(1.08,.92)}100%{transform:none}}
.x8think{animation:x8think 2.4s var(--x8-std) infinite;transform-origin:50% 90%}
@keyframes x8think{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(3deg)}}
.x8sleep{animation:x8breathe 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes x8breathe{0%,100%{transform:none}50%{transform:scale(1.03,.97)}}
.x8bub{background:var(--x8-s1);border:1.5px solid var(--x8-line);border-radius:24px;padding:16px 20px;font:800 clamp(19px,5vw,23px)/1.22 var(--x8-head);color:var(--x8-ink);position:relative;text-wrap:balance}
.x8say{display:flex;gap:12px;align-items:center}
.x8say .x8bub{font-size:17px;flex:1}
.x8chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.x8chip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;color:var(--x8-navy);box-shadow:0 4px 0 rgba(6,23,59,.25)}
.x8chip svg{width:18px;height:18px}
.x8f{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:600;color:var(--x8-ink2)}
.x8f input,.x8f select,.x8f textarea{font:500 16px Inter,system-ui,sans-serif;color:var(--x8-ink);background:var(--x8-s2);border:1.5px solid var(--x8-line);border-radius:16px;padding:14px 16px;width:100%;outline:none;transition:border-color .2s}
.x8f textarea{min-height:90px;resize:vertical}
.x8f input:focus,.x8f select:focus,.x8f textarea:focus{border-color:var(--x8-lil)}
.x8f input[aria-invalid="true"]{border-color:var(--x8-coral);animation:x8shake .42s}
.x8f small{font-weight:500;color:var(--x8-ink3)}
.x8err{color:var(--x8-coral);font-size:14px;font-weight:600;min-height:1em}
@keyframes x8shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.x8or{display:flex;align-items:center;gap:12px;color:var(--x8-ink2);font-size:14px;font-weight:600}
.x8or::before,.x8or::after{content:"";flex:1;height:1.5px;background:var(--x8-line)}
.x8seg{display:flex;background:var(--x8-s2);border-radius:999px;padding:4px}
.x8seg button{flex:1;border:0;background:none;color:var(--x8-ink2);font:800 15px var(--x8-head);padding:10px;border-radius:999px;cursor:pointer}
.x8seg button[aria-pressed="true"]{background:var(--x8-s1);color:var(--x8-ink);box-shadow:0 2px 0 #0004}
.x8rule{display:flex;gap:14px;background:var(--x8-s1);border-radius:22px;padding:16px 18px;align-items:flex-start}
.x8rule .ri{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--x8-navy)}
.x8rule .ri svg{width:22px;height:22px}
.x8rule b{font:800 17px var(--x8-head);display:block;margin-bottom:3px}
.x8rule p{color:var(--x8-ink2);font-size:14px;line-height:1.45}
.x8chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;font-weight:500;line-height:1.45;cursor:pointer;color:var(--x8-ink)}

<script>
/*GEN-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function G(rng){return{
  int:(a,b)=>a+Math.floor(rng()*(b-a+1)),
  pick:a=>a[Math.floor(rng()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
};}
const nf=(x,d=2)=>Number(x).toLocaleString('pt-PT',{minimumFractionDigits:d,maximumFractionDigits:d});
const ni=x=>Number(x).toLocaleString('pt-PT',{maximumFractionDigits:0});
const eur=x=>nf(x)+' €';
const pc=(x,d=1)=>nf(x,d)+'%';
const r2=x=>Math.round(x*100)/100;
const dec=x=>String(+x.toFixed(6)).replace('.',',');
const fq=x=>Math.abs(x-Math.round(x))<1e-9?ni(Math.round(x)):nf(x,1);
const T=(head,rows)=>'<div class="tbl"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
  rows.map(r=>'<tr>'+r.map((c,i)=>i===0?'<td class="l"><b>'+c+'</b></td>':'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function opts(g,correct,dist,fb){
  const out=[correct];
  for(const d of dist){if(out.length>=4)break;if(d!=null&&!out.includes(d))out.push(d);}
  let k=1;while(out.length<4&&k<80){const d=fb(k++);if(d!=null&&!out.includes(d))out.push(d);}
  const sh=g.shuffle(out);return{o:sh,a:sh.indexOf(correct)};
}

/* ---- Eleições ---- */
function elec(g){
  const I=g.int(80,900)*10, V=Math.round(I*g.int(55,85)/100);
  const b=Math.round(V*g.int(10,30)/1000)+1, n=Math.round(V*g.int(10,30)/1000)+1, VVE=V-b-n;
  const pA=g.int(36,56)/100, pB=(1-pA)*g.int(53,75)/100;
  const vals=[Math.round(VVE*pA),Math.round(VVE*pB)];vals.push(VVE-vals[0]-vals[1]);
  const lab=g.shuffle(['A','B','C']);
  const cand=lab.map((l,i)=>({l,v:vals[i]}));
  const tab=cand.slice().sort((x,y)=>x.l<y.l?-1:1);
  const c='<p>Resultados de uma eleição:</p>'+T(['Dados','N.º'],[['Inscritos',ni(I)],['Votantes',ni(V)],['Votos em branco',ni(b)],['Votos nulos',ni(n)]])+
    T(['Candidato','Votos'],tab.map(x=>[x.l,ni(x.v)]));
  return{I,V,b,n,VVE,cand,c};
}
function perms(n){if(n===1)return[[0]];const r=[];perms(n-1).forEach(p=>{for(let i=0;i<=p.length;i++){const q=p.slice();q.splice(i,0,n-1);r.push(q);}});return r;}
const LET='ABCD';
function analyze(cols,p){
  const first=Array(p).fill(0),last=Array(p).fill(0),borda=Array(p).fill(0);
  cols.forEach(c=>{first[c.o[0]]+=c.v;last[c.o[p-1]]+=c.v;c.o.forEach((cand,pos)=>borda[cand]+=c.v*(p-pos));});
  return{first,last,borda};
}
const argmax=a=>a.indexOf(Math.max(...a));
const uniq=a=>a.filter(x=>x===Math.max(...a)).length===1;
function prefGen(g,p,ncols,vmin,vmax,need,strict){
  const P=perms(p);let last=null;
  for(let t=0;t<400;t++){
    const cols=[];const used=new Set();
    while(cols.length<ncols){const o=g.pick(P);const k=o.join('');if(used.has(k))continue;used.add(k);cols.push({v:g.int(vmin,vmax),o});}
    const info=analyze(cols,p);
    if(need(info)){last={cols,info};if(!strict||t>=250||strict(info))return last;}
  }
  return last;
}
function prefTable(cols,p){return T(['N.º de votos',...cols.map(c=>ni(c.v))],Array.from({length:p},(_,r)=>[(r+1)+'.ª preferência',...cols.map(c=>LET[c.o[r]])]));}
function bordaSteps(cols,p){
  const s=['Pontos: '+Array.from({length:p},(_,i)=>(i+1)+'.º = '+(p-i)).join(' · ')];
  for(let c=0;c<p;c++){
    const terms=cols.map(col=>col.v+'×'+(p-col.o.indexOf(c)));
    const tot=cols.reduce((s,col)=>s+col.v*(p-col.o.indexOf(c)),0);
    s.push(LET[c]+' = '+terms.join(' + ')+' = '+ni(tot));
  }
  const V=cols.reduce((s,c)=>s+c.v,0),sp=p*(p+1)/2;
  s.push('Controlo: '+ni(V)+' votos × '+sp+' = '+ni(V*sp)+' ✓');
  return s;
}

/* ---- Partilha ---- */
function alloc(v,m,div){
  const q=[];v.forEach((x,i)=>{for(let k=0;k<m;k++)q.push({i,k,q:x/div(k)});});
  q.sort((a,b)=>b.q-a.q);const seats=v.map(()=>0);q.slice(0,m).forEach(e=>seats[e.i]++);
  return{seats,last:q[m-1].q,next:q[m].q,top:q.slice(0,m)};
}
const dH=k=>k+1,dS=k=>2*k+1;
const PCTX=[
  {intro:m=>'Distribuir <b>'+m+' mandatos</b> pelas listas, de acordo com os votos:',col:'Lista',val:'Votos',L:['A','B','C','D'],one:'um mandato'},
  {intro:m=>'Uma escola de dança tem <b>'+m+' dias de ensaio</b> para distribuir pelas modalidades, de acordo com o n.º de alunos:',col:'Modalidade',val:'Alunos',L:['Ballet','Jazz','Hip-Hop','Contemporâneo'],one:'um dia'},
  {intro:m=>'Um município vai distribuir <b>'+m+' formadores</b> pelas aldeias, de acordo com o n.º de habitantes:',col:'Aldeia',val:'Habitantes',L:['Alegre','De Cima','De Baixo','Esperança'],one:'um formador'},
  {intro:m=>'Uma empresa vai distribuir <b>'+m+' representantes</b> pelos departamentos, de acordo com o n.º de colaboradores:',col:'Departamento',val:'Colaboradores',L:['Produção','Comercial','Logística','Apoio'],one:'um representante'}];
function partGen(g,needZero){
  for(let t=0;t<500;t++){
    const sc=g.pick(PCTX),m=g.int(5,8),big=g.int(25,95)*10;
    const v=[big,Math.round(big*g.int(45,80)/100),Math.round(big*g.int(24,44)/100),Math.round(big*g.int(6,22)/100)];
    const H=alloc(v,m,dH),S=alloc(v,m,dS);
    if(Math.abs(H.last-H.next)<0.6||Math.abs(S.last-S.next)<0.6)continue;
    if(needZero&&H.seats[3]!==0)continue;
    return{sc,m,v,H,S};
  }
}
const seatStr=(L,s)=>L.map((l,i)=>l+' '+s[i]).join(' · ');
function perturb(s){const out=[];for(let i=0;i<s.length;i++)for(let j=0;j<s.length;j++){if(i!==j&&s[i]>0){const c=s.slice();c[i]--;c[j]++;out.push(c);}}return out;}
function allocSteps(P,R,div,name){
  const L=P.sc.L,s=[name];
  P.v.forEach((x,i)=>{const k=Math.min(Math.max(R.seats[i]+1,2),5);s.push(L[i]+': '+Array.from({length:k},(_,j)=>fq(x/div(j))).join(' · '));});
  s.push('Os '+P.m+' maiores: '+R.top.map(e=>fq(e.q)).join(', '));
  s.push('Resultado: '+seatStr(L,R.seats));
  return s;
}

/* ---- Finanças ---- */
const RET=[{hi:1106.93,tx:26.5,pa:169.09},{lo:1110,hi:1600.36,tx:28.5,pa:191.23},{lo:1610,hi:1961.36,tx:35,pa:295.25},{lo:1970,hi:2529.05,tx:37,pa:334.48}];
const retTable=()=>T(['Remuneração mensal','Taxa marginal máxima','Parcela a abater','Parcela adicional por dependente'],RET.map(r=>['Até '+eur(r.hi),pc(r.tx,2),eur(r.pa),'21,43 €']));
function retGen(g){const ri=g.int(1,3),row=RET[ri];const SB=g.int(Math.ceil(row.lo/10),Math.floor(row.hi/10))*10;const dep=g.int(0,5);
  const base=SB*row.tx/100,r=r2(base-row.pa-dep*21.43);
  const sit=dep===0?'sem dependentes':dep+' dependente'+(dep>1?'s':'');
  return{ri,row,SB,dep,base,r,sit,c:'<p>Salário bruto mensal: <b>'+eur(SB)+'</b>, '+sit+'. Tabela de retenção na fonte:</p>'+retTable()};}
function retSteps(R){return['A linha certa é a 1.ª cujo "Até" é maior que '+eur(R.SB)+' → até '+eur(R.row.hi)+': taxa '+pc(R.row.tx,2)+', parcela '+eur(R.row.pa),
  'r = '+eur(R.SB)+' × '+dec(R.row.tx/100)+' − '+eur(R.row.pa)+' − '+R.dep+' × 21,43',
  'r = '+eur(r2(R.base))+' − '+eur(R.row.pa)+' − '+eur(r2(R.dep*21.43))+' = '+eur(R.r)];}
const LIM=[7479,11284,15992,20700,26355,38632,50483],MAR=[14.5,21,26.5,28.5,35,37,43.5],MED=[14.5,16.69,19.58,21.61,24.48,28.46,31.99];
const irsTable=()=>T(['Escalão','Rendimento coletável','Taxa marginal','Taxa média'],LIM.map((l,i)=>[(i+1)+'.º',i===0?'Até '+ni(l)+' €':'Mais de '+ni(LIM[i-1])+' € até '+ni(l)+' €',pc(MAR[i],2),pc(MED[i],2)]));
function irsGen(g){const k=g.int(1,6);const C=g.int(Math.ceil(LIM[k-1]/10)+5,Math.floor(LIM[k]/10)-5)*10;const bruto=C+4104;
  const p1=r2(LIM[k-1]*MED[k-1]/100),exc=C-LIM[k-1],p2=r2(exc*MAR[k]/100),col=r2(p1+p2);
  const ded=Math.max(300,Math.min(g.int(10,25)*100,Math.floor(col*0.45/50)*50)),liq=r2(col-ded);
  return{k,C,bruto,ded,p1,exc,p2,col,liq};}
function jcGen(g){return{C:g.int(10,120)*100,rr:g.int(4,20)*0.25,n:g.int(2,8)};}
const KN={1:'anual',2:'semestral',4:'trimestral',12:'mensal'};
function jcK(g,k){const J=jcGen(g),r=J.rr/100,Cf=r2(J.C*Math.pow(1+r/k,k*J.n));
  const {o,a}=opts(g,eur(Cf),[eur(r2(J.C*Math.pow(1+r,J.n))),eur(r2(J.C*Math.pow(1+r/k,J.n))),eur(r2(J.C*Math.pow(1+r,k*J.n))),eur(r2(J.C*(1+r*J.n)))],x=>eur(r2(Cf+x*3.17)));
  return{c:'<p>Aplicação de <b>'+eur(J.C)+'</b> a juro composto, taxa anual de <b>'+pc(J.rr,2)+'</b>, durante <b>'+J.n+' anos</b>, capitalização <b>'+KN[k]+'</b>.</p>',
    q:'Qual é o capital acumulado no fim do prazo?',o,a,
    s:['k = '+k+' (capitalização '+KN[k]+')','Taxa por período = '+dec(r)+' ÷ '+k+' = '+dec(r/k),'Expoente = k × n = '+k+' × '+J.n+' = '+k*J.n,'Cf = '+eur(J.C)+' × (1 + '+dec(r/k)+')^'+k*J.n+' ≈ '+eur(Cf)],
    trap:'Com capitalização '+KN[k]+' mudas DUAS coisas: a taxa (r ÷ '+k+') e o expoente ('+k+' × n). Mudar só uma dá um valor errado que também aparece nas opções.'};}

const TYPES=[
 {t:'Eleições',n:'Votos validamente expressos',h:'vve',g:g=>{const e=elec(g);const {o,a}=opts(g,ni(e.VVE),[ni(e.V),ni(e.V-e.b),ni(e.I-e.b-e.n),ni(e.V-e.n)],k=>ni(e.VVE+k*7));
   return{c:e.c,q:'Quantos votos foram validamente expressos?',o,a,s:['VVE = votantes − brancos − nulos',ni(e.V)+' − '+ni(e.b)+' − '+ni(e.n)+' = '+ni(e.VVE),'Confirmação: '+e.cand.map(x=>ni(x.v)).join(' + ')+' = '+ni(e.VVE)+' ✓'],trap:'Parte dos votantes (não dos inscritos) e tira brancos E nulos.'};}},
 {t:'Eleições',n:'Percentagem de abstenção',h:'abst',g:g=>{const e=elec(g),ab=(e.I-e.V)/e.I*100;const {o,a}=opts(g,pc(ab),[pc(e.V/e.I*100),pc((e.I-e.V)/e.V*100),pc((e.I-e.VVE)/e.I*100)],k=>pc(ab+k*1.3));
   return{c:e.c,q:'Qual foi a percentagem de abstenção (às décimas)?',o,a,s:['Abstenção = '+ni(e.I)+' − '+ni(e.V)+' = '+ni(e.I-e.V)+' pessoas',ni(e.I-e.V)+' ÷ '+ni(e.I)+' × 100 ≈ '+pc(ab),'Controlo: participação '+pc(e.V/e.I*100)+' + abstenção '+pc(ab)+' = 100%'],trap:'A abstenção é quem NÃO votou, a dividir pelos INSCRITOS.'};}},
 {t:'Eleições',n:'Percentagem de um candidato',pri:1,h:'pctc',g:g=>{const e=elec(g),X=g.pick(e.cand),p=X.v/e.VVE*100;const {o,a}=opts(g,pc(p),[pc(X.v/e.V*100),pc(X.v/e.I*100),pc(100-p)],k=>pc(p+k*1.7));
   return{c:e.c,q:'Que percentagem dos votos obteve o candidato '+X.l+' (às décimas)?',o,a,s:['VVE = '+ni(e.V)+' − '+ni(e.b)+' − '+ni(e.n)+' = '+ni(e.VVE),'% de '+X.l+' = '+ni(X.v)+' ÷ '+ni(e.VVE)+' × 100 ≈ '+pc(p)],trap:'A percentagem de um candidato é sobre os votos validamente expressos, não sobre votantes nem inscritos.'};}},
 {t:'Eleições',n:'Maioria absoluta',pri:1,h:'maj',g:(g,n)=>{const e=elec(g),min=Math.floor(e.VVE/2)+1,S=e.cand.slice().sort((x,y)=>y.v-x.v);const L=S[0],B=S[1],C=S[2];
   const st=['VVE = '+ni(e.V)+' − '+ni(e.b)+' − '+ni(e.n)+' = '+ni(e.VVE),ni(e.VVE)+' ÷ 2 = '+nf(e.VVE/2,1)+' → mínimo '+ni(min)+' votos'];
   if(n%2){const {o,a}=opts(g,ni(min),[ni(Math.floor(e.VVE/2)),ni(Math.floor(e.V/2)+1),ni(min+1)],k=>ni(min+k*3));
     return{c:e.c,q:'Qual é o número mínimo de votos para ganhar por maioria absoluta?',o,a,s:st,trap:'Tem de ser MAIS de metade dos votos validamente expressos: se a metade der inteiro soma 1, se der decimal arredonda para cima.'};}
   const win=L.v>=min,s1='Sim, '+L.l+' ganhou à 1.ª volta',s2='Não, há 2.ª volta entre '+L.l+' e '+B.l,s3='Não, há 2.ª volta entre '+L.l+' e '+C.l,s4='Sim, '+B.l+' ganhou à 1.ª volta';
   const {o,a}=opts(g,win?s1:s2,[win?s2:s1,s3,s4],()=>null);
   st.push(win?L.l+' tem '+ni(L.v)+' ≥ '+ni(min)+' → ganha à 1.ª volta':L.l+' tem '+ni(L.v)+' < '+ni(min)+' → ninguém tem maioria absoluta');if(!win)st.push('2.ª volta com os dois mais votados: '+L.l+' e '+B.l);
   return{c:e.c,q:'Houve vencedor por maioria absoluta?',o,a,s:st,trap:'Ser o mais votado não chega: tem de ter mais de metade dos votos validamente expressos.'};}},
 {t:'Eleições',n:'Maioria simples (boletins)',h:'simples',g:g=>{const P=prefGen(g,3,g.int(4,5),2,40,i=>uniq(i.first));const w=argmax(P.info.first);
   const {o,a}=opts(g,LET[w],['A','B','C','Empate'].filter(x=>x!==LET[w]),()=>null);
   return{c:'<p>Boletins de preferência:</p>'+prefTable(P.cols,3),q:'Pelo método de maioria simples, quem ganha?',o,a,s:['Só conta a linha da 1.ª preferência','A = '+P.info.first[0]+' · B = '+P.info.first[1]+' · C = '+P.info.first[2],'Ganha '+LET[w]],trap:'O mesmo candidato pode estar em 1.º lugar em várias colunas: soma-as.'};}},
 {t:'Eleições',n:'Método de Borda (3 candidatos)',h:'borda',g:g=>{const P=prefGen(g,3,g.int(4,5),2,40,i=>uniq(i.borda)&&uniq(i.first),i=>argmax(i.borda)!==argmax(i.first));const w=argmax(P.info.borda);
   const others=[0,1,2].filter(x=>x!==w);const {o,a}=opts(g,LET[w],[LET[others[0]],LET[others[1]],'Empate entre '+LET[others[0]]+' e '+LET[others[1]]],()=>null);
   return{c:'<p>Boletins de preferência:</p>'+prefTable(P.cols,3),q:'Pelo método de Borda, quem ganha?',o,a,s:[...bordaSteps(P.cols,3),'Ganha '+LET[w]],trap:'O 1.º lugar recebe MAIS pontos (3) e o último recebe 1. Percorre todas as colunas para cada candidato.'};}},
 {t:'Eleições',n:'Candidato menos desejado',pri:1,h:'menos',g:g=>{const P=prefGen(g,3,g.int(4,5),2,40,i=>uniq(i.last),i=>{const w=argmax(i.last);return P_ok(i,w);});const w=argmax(P.info.last);
   const {o,a}=opts(g,LET[w],['A','B','C','Nenhum'].filter(x=>x!==LET[w]),()=>null);
   return{c:'<p>Boletins de preferência:</p>'+prefTable(P.cols,3),q:'Qual é o candidato menos desejado (mais votos em último lugar)?',o,a,s:['Soma a última linha (3.ª preferência) para cada candidato, em todas as colunas','A = '+P.info.last[0]+' · B = '+P.info.last[1]+' · C = '+P.info.last[2],'Menos desejado: '+LET[w]],trap:'Não olhes só para a coluna com mais votos: o mesmo candidato pode estar em último em várias colunas.'};}},
 {t:'Eleições',n:'Método de Borda (4 candidatos)',pri:1,h:'borda',g:g=>{const P=prefGen(g,4,4,15,200,i=>uniq(i.borda),i=>argmax(i.borda)!==argmax(i.first));const w=argmax(P.info.borda);
   const {o,a}=opts(g,LET[w],['A','B','C','D'].filter(x=>x!==LET[w]),()=>null);
   return{c:'<p>Boletins de preferência (4 candidatos):</p>'+prefTable(P.cols,4),q:'Pelo método de Borda, quem ganha?',o,a,s:[...bordaSteps(P.cols,4),'Ganha '+LET[w]],trap:'Com 4 candidatos: 1.º = 4 pontos, 2.º = 3, 3.º = 2, 4.º = 1. Se inverteres, ganha o candidato errado.'};}},

/* Firestore com a mesma forma de chamadas que a versão Claude usa */
function fsAdapter(fs,F){
  const wrap=d=>({id:d.id,data:()=>d.data()});
  const q=(path,cons)=>({
    orderBy:(f,dir)=>q(path,cons.concat([F.orderBy(f,dir||'asc')])),
    limit:n=>q(path,cons.concat([F.limit(n)])),
    onSnapshot:(next,err)=>F.onSnapshot(F.query(F.collection(fs,path),...cons),s=>next({docs:s.docs.map(wrap)}),err),
    add:data=>F.addDoc(F.collection(fs,path),data)});
  return{doc:p=>({set:d=>F.setDoc(F.doc(fs,p),d),delete:()=>F.deleteDoc(F.doc(fs,p))}),collection:p=>q(p,[])};
}

/* --- Revisão espaçada: volta aos tipos onde erraste, com intervalos de 1, 3 e 7 dias --- */
function reviewDue(){
  const by={};allItems().filter(i=>i.ts&&!i.rt).forEach(i=>{(by[i.t]=by[i.t]||[]).push(i);});
  const now=Date.now(),out=[];
  Object.entries(by).forEach(([t,its])=>{t=+t;if(!active().includes(t))return;its.sort((a,b)=>a.ts-b.ts);
    let lw=-1;its.forEach((i,ix)=>{if(!i.ok)lw=ix;});if(lw<0)return;
    const after=its.length-1-lw,last=its[its.length-1].ts;if(after>=3)return;
    const gap=[1,3,7][after]*864e5;if(now-last>=gap-36e5)out.push({t,after,last});});
  return out.sort((a,b)=>a.last-b.last).slice(0,8).map(x=>x.t);
}

    {n:'Faz '+goal+' exercícios',ic:'target',p:Math.min(items.length,goal),m:goal},

function showResult(S){
  const done=S.list.filter(([t,n])=>st.ans[K(t,n)]!==undefined),okN=done.filter(([t,n])=>st.ans[K(t,n)]===ex(t,n).a).length,p=Math.round(okN/done.length*100);

  const xp=okN*10+(done.length-okN)*2+(S.kind==='sim'&&done.length>=14?50:0);
  const head=p===100?'Perfeito.':p>=80?'Muito bem.':p>=60?'Bom caminho.':'Ainda não.';
  const line=p===100?'Acertaste tudo. Estás pronto para isto.':p>=80?'Mais uma volta e fica consolidado.':p>=60?'Revê os errados com a correção e repete a sessão.':'Abre cada errado, lê a correção passo a passo e repete. É assim que fixa.';

  r.innerHTML='<div class="box"><div class="eyebrow">'+esc(S.title)+' · concluída</div><h1>'+head+'</h1><div class="bigpct gt" id="r-pct">0%</div><p class="line">'+line+'</p>'+
    '<div class="rstats"><div style="animation-delay:.55s"><b>'+okN+'/'+done.length+'</b><span>certas</span></div><div style="animation-delay:.7s"><b class="gt">+'+xp+'</b><span>XP ganho</span></div><div style="animation-delay:.85s"><b>'+run+'</b><span>seguidas</span></div></div>'+
    '<div class="acts"><button class="btn pri" id="r-again">'+(S.kind==='tipo'?'Treinar outra vez':'Nova sessão')+'</button><button class="btn" id="r-rev">Ver correções</button><button class="btn ghost" id="r-home">Voltar ao trilho</button></div></div>';
  document.body.appendChild(r);
  const el=r.querySelector('#r-pct');if(RM)el.textContent=p+'%';else{const t0=performance.now();const tick=now=>{const k=Math.min(1,(now-t0)/1100),e=1-Math.pow(1-k,3);el.textContent=Math.round(p*e)+'%';if(k<1)requestAnimationFrame(tick);};requestAnimationFrame(tick);}
  if(p>=60){setTimeout(()=>{rain();tone(SND.win);haptic([30,40,30,40,60]);},350);}
  const close=()=>r.remove();
  r.querySelector('#r-again').onclick=()=>{close();if(S.kind==='tipo'){st.v[S.t]=(st.v[S.t]||0)+1;startSess('tipo',S.t);}else startSess(S.kind);};

  r.querySelector('#r-home').onclick=()=>{close();modTab='ex';go('module');};
  r.querySelector('#r-again').focus();
}

  E.o.forEach((o,j)=>{let cl='opt';if(given!==undefined){if(j===E.a)cl+=' ok';else if(j===given)cl+=' bad';if(isJust&&j===given)cl+=' just';}

function htmlToText(html){const d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('tr').forEach(tr=>{tr.textContent=Array.from(tr.children).map(c=>c.textContent.trim()).join(' | ')+'\n';});
  d.querySelectorAll('p').forEach(p=>p.textContent=p.textContent+'\n');return d.textContent.replace(/\n{3,}/g,'\n\n').trim();}
const STYLE='Responde em português de Portugal, de forma direta, com base nos números. Sem analogias nem exemplos inventados. Texto simples, sem markdown nem asteriscos.';
async function askExplain(t,n){
  if(!sampleFn)return;if(!aiQuotaOk()){toast('Chegaste ao limite de 40 pedidos à IA por hoje.');return;}const E=ex(t,n),k=K(t,n),g=st.ans[k];aiState={key:k,text:''};renderPlay();
  const prompt='És explicador de Matemática do ensino profissional português (módulo P1). '+STYLE+' Máximo 8 linhas. O aluno chama-se '+(ME.nick||'Kaizer')+'.\n\nTipo: '+TYPES[t].n+'\nEnunciado:\n'+htmlToText(E.c)+'\nPergunta: '+E.q+'\nOpções: '+E.o.map((o,j)=>'('+'ABCD'[j]+') '+o).join('; ')+
    '\nEscolheu: ('+'ABCD'[g]+') '+E.o[g]+'\nCerta: ('+'ABCD'[E.a]+') '+E.o[E.a]+'\nResolução:\n'+E.s.join('\n')+(g===E.a?'\n\nAcertou: explica o raciocínio essencial e a armadilha a evitar.':'\n\nErrou: identifica o erro provável que leva à opção escolhida e mostra o passo correto.');
  ME.ai=(ME.ai||0)+1;syncProfile();
  try{const r=await sampleFn(prompt,{onText:({text})=>{if(aiState&&aiState.key===k){aiState.text=text;const b=document.getElementById('ai-body');if(b)b.textContent=text;}}});if(aiState&&aiState.key===k){aiState.text=r.text;renderPlay();}}
  catch(e){if(aiState&&aiState.key===k){aiState.err=e&&(e.code==='rate_limited'||e.code==='busy')?'A IA está com muitos pedidos neste momento. Tenta daqui a um minuto.':e&&e.code==='not_granted'?'A IA não foi autorizada nesta página.':e&&e.code==='login'?'A ligar ao servidor. Tenta daqui a uns segundos.':'Não foi possível obter a explicação agora.';renderPlay();}}
}
let histAI=null;
async function askHistory(){
  if(!sampleFn)return;const agg=typeAgg();
  const lines=Object.values(agg).sort((a,b)=>a.o/a.d-b.o/b.d).map(a=>TYPES[a.t].n+' ('+TYPES[a.t].t+'): '+a.o+'/'+a.d);
  const wrong=allItems().filter(i=>!i.ok).slice(-15).map(i=>i.tn+': escolheu '+i.esc+', certa '+i.cert);
  const notDone=active().filter(t=>!agg[t]).map(t=>TYPES[t].n);
  const prompt='És explicador de Matemática do ensino profissional português (módulo P1). '+STYLE+' Máximo 12 linhas. Analisa o histórico do aluno '+(ME.nick||'Kaizer')+': 1) o que já domina, 2) erros que se repetem e causa provável, 3) o que treinar a seguir, por ordem.\n\nResultados por tipo:\n'+lines.join('\n')+'\n\nÚltimos erros:\n'+(wrong.join('\n')||'nenhum')+'\n\nAinda não feitos: '+(notDone.join(', ')||'nenhum');
  histAI={text:''};ME.ai=(ME.ai||0)+1;syncProfile();renderProfile();
  try{const r=await sampleFn(prompt,{onText:({text})=>{histAI.text=text;const b=document.getElementById('hai-body');if(b)b.textContent=text;}});histAI={text:r.text};renderProfile();}
  catch(e){histAI={err:e&&(e.code==='rate_limited'||e.code==='busy')?'A IA está com muitos pedidos neste momento. Tenta daqui a um minuto.':'Não foi possível fazer a análise agora.'};renderProfile();}
}

  ctx.beginPath();ctx.moveTo(s.p[0][0],s.p[0][1]);s.p.forEach(pt=>ctx.lineTo(pt[0],pt[1]));if(s.p.length===1)ctx.lineTo(s.p[0][0]+.1,s.p[0][1]);ctx.stroke();ctx.globalCompositeOperation='source-over';}

/* ================= Calculadora científica ================= */
/*CALC-START*/
function fact(n){if(n<0||n>170||Math.abs(n-Math.round(n))>1e-9)throw 0;let r=1;for(let i=2;i<=Math.round(n);i++)r*=i;return r;}
function calcEval(src,ans,deg){
  const s=src.replace(/\s+/g,'').replace(/\*/g,'×').replace(/\//g,'÷').replace(/x/gi,'×').replace(/-/g,'−');let i=0;
  const tr=x=>deg?x*Math.PI/180:x,itr=x=>deg?x*180/Math.PI:x;
  const FN={sin:x=>Math.sin(tr(x)),cos:x=>Math.cos(tr(x)),tan:x=>Math.tan(tr(x)),asin:x=>itr(Math.asin(x)),acos:x=>itr(Math.acos(x)),atan:x=>itr(Math.atan(x)),log:Math.log10,ln:Math.log,'√':Math.sqrt,abs:Math.abs};
  const CONST={'π':Math.PI,'e':Math.E,'Ans':ans};
  const ID=/^(asin|acos|atan|sin|cos|tan|log|ln|abs|Ans|π|√|e)/;
  const peek=()=>s[i];
  function num(){const m=/^(\d+([.,]\d*)?|[.,]\d+)/.exec(s.slice(i));if(!m)return null;i+=m[0].length;return parseFloat(m[0].replace(',','.'));}
  function primary(){const c=peek();
    if(c==='−'){i++;return -power();}
    if(c==='+'){i++;return power();}
    if(c==='('){i++;const v=expr();if(peek()===')')i++;return v;}
    const n=num();if(n!==null)return n;
    const m=ID.exec(s.slice(i));if(m){i+=m[0].length;const id=m[0];if(id in CONST)return CONST[id];
      let arg;if(peek()==='('){i++;arg=expr();if(peek()===')')i++;}else arg=postfix(primary());return FN[id](arg);}
    throw 0;}
  function postfix(v){for(;;){const c=peek();if(c==='!'){i++;v=fact(v);}else if(c==='%'){i++;v=v/100;}else if(c==='²'){i++;v=v*v;}else return v;}}
  function power(){const b=postfix(primary());if(peek()==='^'){i++;return Math.pow(b,expo());}return b;}
  function expo(){if(peek()==='−'){i++;return -expo();}if(peek()==='+'){i++;return expo();}return power();}
  function term(){let v=power();for(;;){const c=peek();if(c==='×'){i++;v*=power();}else if(c==='÷'){i++;v/=power();}
    else if(c!==undefined&&(c==='('||/\d/.test(c)||ID.test(s.slice(i)))){v*=power();}else return v;}}
  function expr(){let v=term();for(;;){const c=peek();if(c==='+'){i++;v+=term();}else if(c==='−'){i++;v-=term();}else return v;}}
  if(!s)throw 0;const v=expr();if(i<s.length)throw 0;if(typeof v!=='number'||!isFinite(v))throw 0;return v;
}
/*CALC-END*/
const inp=document.getElementById('calc-in'),res=document.getElementById('res'),hist=document.getElementById('hist'),hl=document.getElementById('hlist');
let ans=0,deg=true,H=[];
const fmtC=n=>{if(Math.abs(n)>=1e12||(Math.abs(n)<1e-6&&n!==0))return n.toExponential(6).replace('.',',');const r=Math.round(n*1e8)/1e8;return r.toLocaleString('pt-PT',{maximumFractionDigits:8,useGrouping:false});};
function live(){const s=inp.value.trim();res.classList.remove('err');if(!s){res.textContent='';return;}try{res.textContent='= '+fmtC(calcEval(s,ans,deg));}catch(e){res.textContent='';}}
function calc(){const s=inp.value.trim();if(!s)return;
  try{const v=calcEval(s,ans,deg);ans=v;hist.textContent=s+' =';res.classList.remove('err');res.textContent=fmtC(v);H.unshift([s,fmtC(v)]);H=H.slice(0,6);renderH();inp.value='';}
  catch(e){res.classList.add('err');res.textContent='Conta incompleta ou inválida. Verifica os parênteses e os operadores.';}}
function renderH(){hl.innerHTML=H.map((h,i)=>'<button data-h="'+i+'"><span>'+esc(h[0])+'</span><span>'+h[1]+'</span></button>').join('');hl.querySelectorAll('button').forEach(b=>b.onclick=()=>{inp.value+=H[+b.dataset.h][1];live();});}
function ins(t){if(!inp.value&&/^[×÷+^%²!]$/.test(t)&&res.textContent&&!res.classList.contains('err'))inp.value='Ans';inp.value+=t;live();}
document.getElementById('keys').addEventListener('click',e=>{const b=e.target.closest('.key');if(!b)return;if(b.dataset.i!==undefined){ins(b.dataset.i);return;}const a=b.dataset.a;
  if(a==='C'){inp.value='';res.textContent='';hist.textContent='';res.classList.remove('err');}
  else if(a==='del'){inp.value=inp.value.replace(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|log\(|ln\(|√\(|Ans|.)$/,'');live();}
  else if(a==='eq')calc();else if(a==='inv'){inp.value=inp.value?'1÷('+inp.value+')':'1÷(Ans)';live();}else if(a==='neg'){inp.value=inp.value?'−('+inp.value+')':'−';live();}});
document.querySelectorAll('.tpl button').forEach(b=>b.onclick=()=>{inp.value+=b.dataset.t;live();});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();calc();}if(e.key==='Escape'){inp.value='';live();}});
inp.addEventListener('input',live);

/* --- Mural --- */
let posts=[],unsubPosts=null,postsState='idle',postImg='',openComs={},comSubs={},coms={},postBusy=false;
function stopMural(){if(unsubPosts){try{unsubPosts();}catch(e){}}unsubPosts=null;postsState='idle';posts=[];Object.values(comSubs).forEach(f=>{try{f();}catch(e){}});comSubs={};coms={};openComs={};}
function subPosts(){if(!isFB())return;if(unsubPosts)return;postsState='loading';const F=FB.Fs;
  const tm=setTimeout(()=>{if(postsState==='loading'){postsState='err';if(view==='comm'&&commTab==='mural')renderFeed();}},12000);
  unsubPosts=F.onSnapshot(F.query(fcol('posts'),F.orderBy('ts','desc'),F.limit(40)),s=>{clearTimeout(tm);postsState='ok';posts=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(view==='comm'&&commTab==='mural')renderFeed();},
    ()=>{clearTimeout(tm);postsState='err';if(view==='comm'&&commTab==='mural')renderFeed();});}
function subComs(id){if(comSubs[id]||!isFB())return;const F=FB.Fs;coms[id]=null;
  comSubs[id]=F.onSnapshot(F.query(fcol('posts/'+id+'/coments'),F.orderBy('ts','asc'),F.limit(60)),s=>{coms[id]=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(view==='comm'&&commTab==='mural')renderFeed();},()=>{coms[id]=[];});}

function renderFeed(){const box=document.getElementById('feed');if(!box)return;

    F.updateDoc(fdoc('posts/'+p.id),{['likes.'+uid]:on?true:F.deleteField()}).catch(()=>toast('Não foi possível registar o gosto.'));if(on){haptic(8);tone(SND.tap);}});

  box.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{const [pid,cid]=b.dataset.cdel.split('|');F.deleteDoc(fdoc('posts/'+pid+'/coments/'+cid)).catch(()=>toast('Não foi possível apagar.'));});

  box.querySelectorAll('[data-cf]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const i=f.querySelector('input'),text=i.value.trim().slice(0,500);if(!text)return;i.value='';const pid=f.dataset.cf;
    F.addDoc(fcol('posts/'+pid+'/coments'),{uid,text,ts:Date.now()}).then(()=>logEv('com',{p:pid,t:text})).catch(()=>{i.value=text;toast('Não foi possível comentar.');});});

function bindMural(el){const f=el.querySelector('#pcomp');if(!f)return;subPosts();renderFeed();
  const fi=el.querySelector('#p-img');if(fi)fi.onchange=async()=>{const file=fi.files&&fi.files[0];if(!file)return;try{postImg=await readPostImg(file);const t=el.querySelector('#p-txt').value;renderComm();el.querySelector('#p-txt').value=t;}catch(e){toast('Não foi possível abrir essa imagem.');}};
  const ni=el.querySelector('#p-noimg');if(ni)ni.onclick=()=>{const t=el.querySelector('#p-txt').value;postImg='';renderComm();el.querySelector('#p-txt').value=t;};
  f.onsubmit=async e=>{e.preventDefault();if(postBusy)return;const ta=el.querySelector('#p-txt'),text=ta.value.trim().slice(0,1000);if(!text&&!postImg){toast('Escreve alguma coisa ou junta uma foto.');return;}
    postBusy=true;el.querySelector('#p-go').disabled=true;
    try{await FB.Fs.addDoc(fcol('posts'),{uid,text,img:postImg||'',ts:Date.now(),likes:{}});logEv('post',{t:text,f:postImg?1:0});postImg='';ta.value='';toast('Publicado no mural.');burst(innerWidth/2,innerHeight/3,24);}
    catch(x){toast('Não foi possível publicar. Verifica a internet.');}
    postBusy=false;renderComm();};
}

/* --- Proteção de sequência: ganhas 1 a cada 7 dias seguidos (máx. 2); usa-se sozinha se falhares um dia --- */
st.frz=st.frz||{have:0,used:[],lastKey:''};
const frzDays=()=>new Set((st.frz&&st.frz.used)||[]);
function activeDaySet(){const ds=new Set(HIST.filter(d=>d.items&&d.items.some(i=>i.ts)).map(d=>d.date));frzDays().forEach(x=>ds.add(x));return ds;}
streakOf=function(){const ds=activeDaySet();let s=0;const d=new Date();if(!ds.has(dstr(d)))d.setDate(d.getDate()-1);while(ds.has(dstr(d))){s++;d.setDate(d.getDate()-1);}return s;};
bestStreak=function(){const ds=[...activeDaySet()].sort();let b=0,c=0,prev=null;ds.forEach(x=>{const dt=new Date(x+'T12:00:00');if(prev&&(dt-prev)/864e5<1.5)c++;else c=1;b=Math.max(b,c);prev=dt;});return b;};
function frzTick(){const F=st.frz,ds=activeDaySet();let changed=false;
  // usar: dias em falta entre o último dia ativo e ontem
  const y=new Date();y.setDate(y.getDate()-1);const gap=[];const d=new Date(y);
  for(let i=0;i<4&&!ds.has(dstr(d));i++){gap.push(dstr(d));d.setDate(d.getDate()-1);}
  if(gap.length&&gap.length<=F.have&&ds.has(dstr(d))){gap.forEach(x=>F.used.push(x));F.have-=gap.length;changed=true;
    setTimeout(()=>toast('Usaste '+pl(gap.length,'proteção','proteções')+'. A tua sequência de '+streakOf()+' dias continua.'),1500);}
  // ganhar: ao chegar a 7, 14, 21… dias seguidos
  const s=streakOf();if(s>0&&s%7===0&&ds.has(today())&&F.lastKey!==today()&&F.have<2){F.have++;F.lastKey=today();changed=true;setTimeout(()=>toast('Ganhaste uma proteção de sequência por '+s+' dias seguidos.'),1200);}
  F.used=F.used.slice(-60);if(changed)save();}

/* --- Tutor IA: API Gemini direta, com modelos de recurso quando um está sobrecarregado --- */
const AI_MODELS=['gemini-3.5-flash-lite','gemini-3.5-flash','gemini-flash-lite-latest','gemini-flash-latest'];
async function geminiAsk(prompt,opts){
  const body=JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:.4,maxOutputTokens:900}});
  let last=null;
  for(let round=0;round<2;round++){for(const m of AI_MODELS){
    let r;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':streamGenerateContent?alt=sse',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':window.GEMINI_KEY},body});}
    catch(e){last={code:'net'};continue;}
    if(r.status===429||r.status===503||r.status===500||r.status===404){last={code:r.status===429?'rate_limited':'busy'};continue;}
    if(!r.ok){last={code:'http'+r.status};continue;}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',t='';
    while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line.indexOf('data:')!==0)continue;
        try{const j=JSON.parse(line.slice(5));const c=j.candidates&&j.candidates[0];if(c&&c.content&&c.content.parts){t+=c.content.parts.map(p=>p.text||'').join('');if(opts&&opts.onText)opts.onText({text:t});}}catch(e){}}}
    if(t.trim())return{text:t};last={code:'empty'};}
    await new Promise(z=>setTimeout(z,1200));}
  const e=new Error('ia');e.code=last&&last.code==='rate_limited'?'rate_limited':'busy';throw e;}

  h+='<div style="display:flex;flex-direction:column;gap:14px"><div class="x8goalc'+(done?' done':'')+'"><div style="min-width:0"><span class="gl">Objetivo de hoje</span><b class="gn">'+S.today+'<small>/'+goal+'</small></b><div class="gb"><i style="width:'+Math.min(100,Math.round(S.today/goal*100))+'%"></i></div><span class="gs">'+(done?'Cumprido! O que fizeres agora é extra.':'Falta'+(falta>1?'m ':' ')+falta+' exercício'+(falta>1?'s':''))+'</span></div>'+NEX8(pose,104)+'</div>';
  h+='<button class="x8p w" id="h8-go">'+(cont?'Continuar: '+esc(sess.title):S.total?'Continuar a praticar':'Começar a praticar')+'</button>';
  h+=td!==null?'<button class="x8tst" id="h8-tst">'+X8ic('cal')+'<div><b>'+(td===0?'Teste hoje':td===1?'Teste amanhã':'Teste em '+td+' dias')+'</b><span>Matemática · '+(td<=1?'faz uma revisão dos pontos fracos':'faz uma simulação')+'</span></div>'+X8ic('chev')+'</button>'
    :'<button class="x8tst sf" data-go2="profile" data-tab="edit">'+X8ic('cal')+'<div><b>Quando é o próximo teste?</b><span>Marca a data e o Nex diz-te o que treinar.</span></div>'+X8ic('chev')+'</button>';
  h+='</div><div style="display:flex;flex-direction:column;gap:12px"><h2 class="x8h2" style="margin-top:0">Modos</h2><div class="x8modes">'+
    [['sim','var(--x8-blue)','#4A84D6','quiz','Simulação','14 perguntas'],['weak','var(--x8-coral)','#D56B4D','alert','Pontos fracos',weak?weak+' tipo'+(weak>1?'s':''):'nenhum agora'],['rev','var(--x8-pink)','#C567A3','repeat','Revisão',DUE.length?DUE.length+' para hoje':'em dia'],['mix','var(--x8-green)','#00A672','cards','Misturado','um pouco de tudo']]
    .map(([k,c,s,i,t,d])=>'<button class="x8mode" data-h8="'+k+'" style="background:'+c+';box-shadow:0 5px 0 '+s+'">'+X8ic(i)+'<b>'+t+'</b><span>'+d+'</span></button>').join('')+'</div>';
  h+='<h2 class="x8h2">Disciplinas</h2><div class="x8subjs">'+SUBJ.map(x=>{const col={g0:'var(--x8-blue)',g1:'var(--x8-yel)',g2:'var(--x8-lil)',g3:'var(--x8-pink)',g4:'var(--x8-coral)',g5:'#FF7A3D'}[x.g]||'var(--x8-lil)';return'<button class="x8subj'+(x.on?'':' off')+'" '+(x.on?'data-subj="'+x.id+'"':'data-soon="'+esc(x.n)+'"')+'><span class="si" style="background:'+col+'">'+IC[x.ic]+'</span>'+esc(x.n)+(x.on?'':'<em>em breve</em>')+'</button>';}).join('')+'</div></div>';
  h+='<div class="home2 full"><div class="card"><div class="cardh"><h2>Missões de hoje</h2><span>'+M.filter(m=>m.done).length+'/3 · +20 XP cada</span></div><div class="missions">'+
    M.map(m=>'<div class="mis'+(m.done?' done':'')+'"><span class="mi">'+(m.done?IC.check:IC[m.ic])+'</span><div><b>'+esc(m.n)+'</b><div class="bar"><i class="'+(m.done?'ok':'')+'" style="width:'+Math.round(m.p/m.m*100)+'%"></i></div></div><span class="rw">'+(m.done?'feito':m.p+'/'+m.m)+'</span></div>').join('')+'</div></div>';
  h+='<div class="card"><div class="cardh"><h2>Esta semana</h2><span>'+W.reduce((s,w)=>s+w.n,0)+' exercícios</span></div><div class="week">'+
    W.map(w=>'<div><em>'+(w.n||'')+'</em><i class="'+(w.n?'on':'')+(w.today?' today':'')+'" style="height:'+Math.max(4,Math.round(w.n/wmax*86))+'px"></i><span>'+w.lab+'</span></div>').join('')+'</div></div></div></div>';
  const el=document.getElementById('v-home');el.innerHTML=h;bindCommon(el);bindInstall(el);
  el.querySelectorAll('[data-soon]').forEach(b=>b.onclick=()=>toast(b.dataset.soon+' chega em breve.'));
  const g=el.querySelector('#h8-go');g.onclick=()=>{if(cont){go('play');loadPad();}else startSess(weakTypes(1).length?'weak':S.total?'mix':'sim');};
  const t=el.querySelector('#h8-tst');if(t)t.onclick=()=>startSess(td<=1&&weakTypes(1).length?'weak':'sim');
  el.querySelectorAll('[data-h8]').forEach(b=>b.onclick=()=>startSess(b.dataset.h8));
};

/* ================= Arranque ================= */
importOld();
try{frzTick();}catch(e){}
go('home');
connect();
handleLaunchParams();
splash(()=>setTimeout(()=>{onboarding();},350));
</script>
